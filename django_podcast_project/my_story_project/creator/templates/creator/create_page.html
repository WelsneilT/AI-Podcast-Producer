{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Storybook Creator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- === BẢN SỬA LỖI CSS CUỐI CÙNG === -->
    <style>
        @font-face {
            font-family: 'Little Monster';
            src: url("{% static 'fonts/LittleMonster.woff2' %}") format('woff2'),
                 url("{% static 'fonts/LittleMonster.woff' %}") format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* Biến màu cho Light Mode (chủ đạo là màu nâu) */
            --text-color-main: #4a362a; /* Màu chữ chính: Nâu sẫm */
            --text-shadow-main: 1px 1px 2px rgba(255, 248, 230, 0.6);
            --sidebar-bg: rgba(0, 0, 0, 0.05);
            --button-bg: #8a6d3b;
            --button-hover-bg: #6b552d;
            --border-color: rgba(0,0,0,0.15);
        }

        body.dark-mode {
            /* Biến màu cho Dark Mode */
            --text-color-main: #dcd1c1; /* Màu chữ chính: Nâu sáng / be */
            --text-shadow-main: 1px 1px 3px rgba(0,0,0,0.7);
            --sidebar-bg: rgba(0, 0, 0, 0.2);
            --button-bg: #ab8e5c;
            --button-hover-bg: #8a6d3b;
            --border-color: rgba(255,255,255,0.15);
        }

        body {
            /* SỬA LỖI 1: Áp dụng ảnh nền trực tiếp */
            background-image: url("{% static 'images/ui/parchment_bg.jpg' %}");
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Crimson Pro', serif;
            display: flex;
            height: 100vh;
            margin: 0;
            color: var(--text-color-main);
        }

        body.dark-mode {
            /* SỬA LỖI 2: Phủ một lớp màu tối lên trên ảnh nền có sẵn */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                url("{% static 'images/ui/parchment_bg.jpg' %}");
        }
        
        .sidebar {
            width: 350px;
            padding: 20px;
            background-color: var(--sidebar-bg);
            backdrop-filter: blur(5px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .main-content { 
            padding: 0; 
            margin: 0; 
            display: flex; 
            justify-content: center;
            flex-grow: 1; 
            overflow-y: auto; 
        }
        .main-content::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        .main-content, body { -ms-overflow-style: none; scrollbar-width: none; }

        #book-container { padding: 2rem 3rem; margin: 2rem 0; max-width: 1400px; width: 100%; }
        
        #initial-message h1, .portrait-card h3, .chapter-title-text, #full-podcast-player h2 {
            font-family: 'Little Monster', 'Playfair Display', serif;
        }

        #story-introduction { 
            text-align: center; 
            margin-bottom: 4rem; 
            padding-bottom: 2rem; 
            border-bottom: 1px solid var(--border-color); 
        }
        #character-portraits { 
            display: flex; justify-content: center; align-items: flex-start;
            gap: 3rem; flex-wrap: wrap; margin-bottom: 2rem;
        }
        .portrait-card { width: 280px; text-align: center; }
        .portrait-card h3 { font-size: 1.8em; margin-top: 0.5rem; color: var(--text-color-main); }
        .portrait-card img { 
            width: 100%; height: 220px; object-fit: cover; 
            border-radius: 8px; margin-bottom: 1rem; border: 4px solid #c9b89b; 
        }
        #introduction-text { 
            font-size: 1.25em; line-height: 1.8; max-width: 750px; 
            margin: 0 auto; font-style: italic; font-weight: 500; 
            color: var(--text-color-main); text-shadow: var(--text-shadow-main);
        }

        .chapter-container { margin-bottom: 4rem; padding-bottom: 2rem; overflow: auto; }
        .chapter-media { width: 45%; float: left; margin-right: 2.5rem; margin-bottom: 1rem; }
        .chapter-media img { border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; height: auto; }
        .chapter-container:nth-child(even) .chapter-media { float: right; margin-left: 2.5rem; margin-right: 0; }
        
        #story-content h2 { 
            font-size: 4em; line-height: 1.2; margin-bottom: 1.5rem;
            color: var(--text-color-main); text-shadow: var(--text-shadow-main); 
        }
        .chapter-number { font-family: 'Crimson Pro', serif; font-weight: 500; }
        .chapter-title-text { font-weight: 700; }

        #story-content p { 
            font-size: 1.25rem;
            line-height: 1.75; 
            color: var(--text-color-main);
            text-shadow: var(--text-shadow-main);
            font-weight: 400; 
            margin-bottom: 1.2em;
        }

        #full-podcast-player { 
            margin: 20px auto 40px auto; padding: 20px; background-color: rgba(0,0,0,0.05); 
            border-radius: 12px; max-width: 800px; border: 1px solid var(--border-color); 
        }
        #full-podcast-player h2 { color: var(--text-color-main); }
        #full-podcast-player audio { width: 100%; }

        #loading-indicator { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.85); z-index: 1000; display: none; 
            justify-content: center; align-items: center; flex-direction: column; 
            color: white; text-align: center; 
        }
        .spinner { 
            border: 8px solid rgba(255, 255, 255, 0.2); border-top: 8px solid #3498db; 
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1.5s linear infinite; 
        }

        #initial-message h1, .portrait-card h3, .chapter-number, .chapter-title-text, #full-podcast-player h2 {
            font-family: 'Little Monster', 'Playfair Display', serif;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <form id="story-form-container" onsubmit="return false;">
            {% csrf_token %}
            <h3>PLOTLINE</h3>
            <textarea id="plotline-input" name="plotline" rows="5" placeholder="A cute garden..."></textarea>
            <h3>CHARACTERS</h3>
            <label for="char1-select">Character 1:</label>
            <select id="char1-select" name="character1">
                <option value="">-- Select --</option>
                {% for char in characters_preset %}
                    <option value="{{ char.name }}">{{ char.name }}</option>
                {% endfor %}
            </select>
            <textarea id="char1-bio" rows="3" placeholder="Character #1 Bio" readonly></textarea>
            <label for="char2-select">Character 2:</label>
            <select id="char2-select" name="character2">
                <option value="">-- Select --</option>
                {% for char in characters_preset %}
                    <option value="{{ char.name }}">{{ char.name }}</option>
                {% endfor %}
            </select>
            <textarea id="char2-bio" rows="3" placeholder="Character #2 Bio" readonly></textarea>
            <button type="button" id="generate-button">✨ Generate Podcast ✨</button>
        </form>
        <button type="button" id="theme-toggle" style="margin-top: auto;">Toggle Dark Mode</button>
    </div>
    
    <div class="main-content">
        <div id="initial-message">
            <h1>Your Storybook Will Appear Here</h1>
            <p>Fill in the details, select your characters, and let the magic begin!</p>
        </div>
        <div id="loading-indicator">
            <div class="spinner"></div>
            <h2 id="loading-message-text">Brewing up your story...</h2>
        </div>
        <div id="story-content" style="display: none;">
             <!-- Nội dung sẽ được JS chèn vào động -->
        </div>
    </div>
    
    {{ characters_preset|json_script:"characters-data" }}
    <script>
        window.CHARACTERS_DATA = JSON.parse(document.getElementById('characters-data').textContent);
        window.APP_CONFIG = {
            CREATE_URL: "{% url 'creator:create_story_view' %}",
            STATUS_URL_BASE: "/api/task-status/"
        };
    </script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
